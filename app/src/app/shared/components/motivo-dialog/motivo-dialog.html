<h2 mat-dialog-title>{{ data.titulo }}</h2>

<mat-dialog-content>
    <p>{{ data.mensaje }}</p>

    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Motivo</mat-label>
        <textarea matInput rows="3" [(ngModel)]="motivo" placeholder="Ingrese el motivo..."></textarea>
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-flat-button [disabled]="!motivo.trim()" (click)="confirmar()">Confirmar</button>
</mat-dialog-actions>
