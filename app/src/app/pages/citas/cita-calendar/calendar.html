<div class="calendar-header">

  <div class="nav-buttons">
    <button (click)="previousPeriod()">◀</button>
    <button (click)="goToToday()">Hoy</button>
    <button (click)="nextPeriod()">▶</button>
  </div>

  <h2 class="calendar-title">
    {{ calendarTitle() }}
  </h2>

  <div class="view-buttons">
    <button (click)="view.set(CalendarView.Month)">Mes</button>
    <button (click)="view.set(CalendarView.Week)">Semana</button> 
  </div>

</div>
<div class="calendar-legend">

  <div class="legend-item">
    <span class="legend-color accepted"></span>
    <span>Aceptada</span>
  </div>

  <div class="legend-item">
    <span class="legend-color pending"></span>
    <span>Pendiente</span>
  </div>

  <div class="legend-item">
    <span class="legend-color cancelled"></span>
    <span>Cancelada</span>
  </div>

  <div class="legend-item">
    <span class="legend-color rejected"></span>
    <span>Rechazada</span>
  </div>

  <div class="legend-item">
    <span class="legend-color completed"></span>
    <span>Completada</span>
  </div>

</div>

<div [ngSwitch]="view()">

  <mwl-calendar-month-view *ngSwitchCase="CalendarView.Month" 
    [viewDate]="viewDate()" 
    [events]="events()"
    [cellTemplate]="monthCellTemplate"
    (eventClicked)="handleEvent($event.event)">
  </mwl-calendar-month-view>


  <mwl-calendar-week-view *ngSwitchCase="CalendarView.Week" [viewDate]="viewDate()" [events]="events()"
    (eventClicked)="handleEvent($event.event)">
  </mwl-calendar-week-view>

  <ng-template #monthCellTemplate let-day="day" let-locale="locale">
    <div class="cal-cell-top">
      <span class="cal-day-number">{{ day.date | date:'d'}}</span>
    </div>
    <div class='cal-events-bar'>
      @for (event of day.events; track event.id) {
        <div class="event-bar"
          [style.background]="event.color?.secondary"
          [style.border-left-color]="event.color?.primary"
          (click)="handleEvent(event)">
          {{ event.title }}
        </div>
      }
    </div>
  </ng-template>

</div>
